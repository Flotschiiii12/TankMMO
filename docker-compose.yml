services:
  treadfront:
    build: .
    container_name: treadfront
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:3000"   # put Caddy/nginx with TLS in front
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      BACKUP_DIR: /data/backups   # daily consistent backups, newest 14 kept
      TRUST_PROXY: "1"           # one reverse proxy hop (Caddy): per-IP REST limits use X-Forwarded-For
    volumes:
      - ./data:/data
